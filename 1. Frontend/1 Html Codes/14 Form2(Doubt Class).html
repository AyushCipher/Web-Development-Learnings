<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>
        Welcome to our Website!!
    </h1>
    <h2>Contact Us Form</h2>
    <form action="">
        <label for="name">Name:</label>
        <input type="text" name="name" 
        id="name"   
        placeholder="Enter Your Name">

        <br>
        <br>

        <label for="email">Email:</label>
        <input type="email" name="email"
        id="email"
        placeholder="Enter Your Email-ID">

        <br>
        <br>

        <label for="contact">Contact:</label>
        <input type="number" name="contact"
        id="contact">

        <br>
        <br>

        <label for="gender">Gender:</label>
        <select id="gender" name="gender">
            <option value="select">Select</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="nottosay">Not To Say</option>
        </select>
        
        <br>
        <br>

        <label for="dob">Date Of Birth:</label>
        <input type="date" name="dob"
        id="dob">

        <br>
        <br>

        <span>Rating:</span>
        <input type="radio" name="rating" id="rating1" value="1">
        <label for="rating1">1</label>
        <input type="radio" name="rating" id="rating2" value="2">
        <label for="rating2">2</label>
        <input type="radio" name="rating" id="rating3" value="3">
        <label for="rating3">3</label>
        <input type="radio" name="rating" id="rating4" value="4">
        <label for="rating4">4</label>
        <input type="radio" name="rating" id="rating5" value="5">
        <label for="rating5">5</label>
        <input type="radio" name="rating" id="rating6" value="6">
        <label for="rating6">6</label>

        <!-- Add Chcekboxes also -->
         

        <br>
        <br>
        
        <label for="msg">Enter Your Message:</label><br>
        <textarea name="message" id="msg" cols="30" rows="5"></textarea>
        
        <br>
        <br>

        <input type="submit" name="submit" id="submit" value="Submit">
        <input type="reset" name="reset" id="reset" value="Reset">
        
        <br>
        <br>

        <footer>
            <a href="https://www.youtube.com" target="_blank" >
                <img src="https://cdn-icons-png.flaticon.com/512/174/174883.png" alt="Youtube Image"
                width="40"
                height="40">
                </a>
    
            <a href="https://www.instagram.com" target="_blank" >
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS6C1TBBMfQZhJ3MDO-Ue8D4hgLQDOe3RFtrEW1-pgSHg&s" alt="Instagram Icon"
                width="40"
                height="40">
                </a>
    
            <a href="https://web.telegram.org" target="_blank" >
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/Telegram_logo.svg/2048px-Telegram_logo.svg.png" alt="Telegram Icon"
                width="40"
                height="40">
                </a>
        </footer>
        
    </form>
</body>
</html>
