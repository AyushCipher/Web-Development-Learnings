<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<!-- We use iframe to embed/ bring the content of another website to our website -->
<body>
    <!-- iframe does not work directly with the link you paste -->
    <!-- An inline frame is used to embed another document within the current HTML document -->
    <iframe src="https://www.google.com" frameborder="0" height="300" width="200"></iframe>

    <!-- Make sure it will only work jb alg se iframe k corresponding code dalenge -->
    <h1>Maps</h1>
    <iframe
  id="inlineFrameExample"
  title="Inline Frame Example"
  width="300"
  height="200"
  src="https://www.openstreetmap.org/export/embed.html?bbox=-0.004017949104309083%2C51.47612752641776%2C0.00030577182769775396%2C51.478569861898606&layer=mapnik">
</iframe>
</body>
</html>
