<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
<!-- To directly create N no. of div's under a div, use the formula:-
     [ .container>box*4{box-$}  ] -->

<!-- FlexBox:- It is a layout method by the help of which we can do space distribution 
    and can work with alignment capabilities -->

<div class="container">
        <div class="box" id="box1">skeuflzsiyudfgkfufxfgdthxs</div>  
        <div class="box" id="box2">box-2</div>
        <div class="box" id="box3">box-3</div>
        <div class="box" id="box4">box-4</div>
</div>

</body>
</html>
