<!DOCTYPE html>
<html lang="en">
    <!-- WAYS OF APPLYING CSS -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- How to link external css file with html file -->
    <link rel="stylesheet" href="Css styles.css">


    <!-- For Internal CSS:_ USed in the head part to modify some properties. -->
    <style>
        p{
            color: green;
            text-shadow: 1px 2px pink;
        }
    </style>
</head>

<body>

    <!-- Inline Css:- Used in the opening tag to modify some properties.
    <p style="font-style: italic">Hello, How are you?</p> -->

    <!-- Internal CSS(Use style tag) -->
    <p>Let's apply internal CSS on this text.</p>

    <h1>This is the first paragraph</h1>

</body>
</html>
