# Q. WHY PUT NGINX IN FRONT OF THE API GATEWAY INSTEAD OF JUST RUNNING ONE
#    GATEWAY CONTAINER ON PORT 3000?
# ANS: One gateway container is a single point of failure and a hard
# ceiling on throughput - every request in the whole system passes through
# it. Running several identical gateway CONTAINERS and putting a load
# balancer in front of them solves both problems: traffic is spread across
# replicas instead of one process doing all the work, and if any single
# replica crashes or is being redeployed, the others keep serving requests
# without clients ever noticing. Nginx is doing exactly that job here - it
# is the ONLY thing external clients ever talk to (port 3000); the gateway
# replicas themselves have no host port published anymore.

# Q. HOW DOES NGINX DECIDE WHICH REPLICA GETS EACH REQUEST?
# ANS: An `upstream` block is just a named pool of backend addresses.
# Nginx's default algorithm for a plain upstream block (no extra directives
# needed) is round-robin - request 1 goes to replica 1, request 2 to
# replica 2, request 3 to replica 3, request 4 back to replica 1, and so on.
upstream api_gateway_pool {
    server api-gateway-1:3000 max_fails=3 fail_timeout=10s;
    server api-gateway-2:3000 max_fails=3 fail_timeout=10s;
    server api-gateway-3:3000 max_fails=3 fail_timeout=10s;

    # Q. WHAT DO max_fails AND fail_timeout ACTUALLY DO?
    # ANS: This is Nginx's built-in PASSIVE health check (open-source Nginx
    # doesn't have active health-check probing - that's an Nginx Plus
    # feature). If a replica fails to respond 3 times in a row, Nginx marks
    # it "down" for fail_timeout (10s here) and stops sending it new
    # requests during that window, automatically retrying it afterwards.
    # Clients never see the dead replica - they just keep getting served by
    # whichever replicas are actually healthy.
}

server {
    listen 80;

    location / {
        proxy_pass http://api_gateway_pool;

        # Q. WHY FORWARD THESE HEADERS INSTEAD OF LETTING THE DEFAULTS
        #    APPLY?
        # ANS: Without this, every request the gateway sees would appear to
        # come from Nginx's own internal IP, not the real client - and the
        # gateway's own rate limiter (api-gateway/src/server.js, keyed on
        # req.ip) would then rate-limit "Nginx" as a whole instead of each
        # real client separately, effectively sharing one rate-limit bucket
        # across every user. X-Forwarded-For carries the real client IP
        # through so that still works correctly.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
