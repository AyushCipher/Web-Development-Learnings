services:
  # Q. WHY DOES THIS KAFKA SETUP NOT NEED A SEPARATE ZOOKEEPER CONTAINER?
  # ANS: Older Kafka setups needed ZooKeeper as a separate service to track
  # broker metadata (which broker is the leader, topic configs, etc).
  # Modern Kafka (since 3.x) can run that same job itself in "KRaft" mode -
  # one process, no second piece of infrastructure to run and keep in sync.
  # This is the officially published Apache Kafka image running in
  # single-node KRaft mode - both broker and controller roles in one
  # container, which is all a learning/demo setup like this needs.
  kafka:
    image: apache/kafka:3.7.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Q. WHY TWO LISTENERS (29092 AND 9092) INSTEAD OF ONE?
      # ANS: Other containers on this docker-compose network reach Kafka by
      # its service name ("kafka"), but your own machine (running
      # `npm start` / the consumer scripts directly on the host, as this
      # project is meant to be run - see README.md) reaches it via
      # "localhost". Kafka's advertised address has to match how the
      # CALLER is connecting, so it needs to advertise itself two different
      # ways depending on who's asking - that's what PLAINTEXT (internal)
      # vs PLAINTEXT_HOST (external) are for here.
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Convenient for a demo (topics spring into existence on first use),
      # but with only 1 partition by default - see src/admin/createTopics.js
      # for why a real deployment creates topics explicitly instead.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
