# ============================================================================
# NGINX Configuration for Load Balancing - Express Extended
# Real production-ready implementation
# Based on: https://github.com/codersgyan/nginx-lb-yt
# ============================================================================

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ============================================================================
    # LOGGING CONFIGURATION
    # ============================================================================
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr response_time: $upstream_response_time';

    log_format upstream_logging '[$time_local] $remote_addr -> $upstream_addr:$upstream_port | Status: $status | Request: "$request" | Upstream response time: $upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ============================================================================
    # PERFORMANCE TUNING
    # ============================================================================
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss
               application/octet-stream;

    # ============================================================================
    # UPSTREAM: Backend Servers (Express Servers via Docker)
    # Docker service names: server1, server2, server3
    # ============================================================================

    # A) ROUND ROBIN (Default) - Distribution: Equal
    # Used for: Standard API requests, general purpose
    upstream backend {
        server server1:3000 max_fails=3 fail_timeout=30s;
        server server2:3000 max_fails=3 fail_timeout=30s;
        server server3:3000 max_fails=3 fail_timeout=30s;
        
        keepalive 64;
    }

    # B) WEIGHTED ROUND ROBIN - Distribute based on server capacity
    # Used for: Servers with different hardware specs
    # Distribution: Server1 (50%), Server2 (30%), Server3 (20%)
    upstream backend_weighted {
        server server1:3000 weight=5;
        server server2:3000 weight=3;
        server server3:3000 weight=2;
        
        keepalive 64;
    }

    # C) LEAST CONNECTIONS - Route to server with fewest active connections
    # Used for: Long-lived connections, WebSocket, real-time features
    upstream backend_least_conn {
        least_conn;
        server server1:3000;
        server server2:3000;
        server server3:3000;
        
        keepalive 64;
    }

    # D) IP HASH / STICKY SESSIONS - Same client always to same server
    # Used for: Session persistence, stateful operations
    # Note: Can cause uneven distribution if many clients from same IP
    upstream backend_sticky {
        ip_hash;
        server server1:3000;
        server server2:3000;
        server server3:3000;
        
        keepalive 64;
    }

    # ============================================================================
    # SERVER CONFIGURATION
    # ============================================================================

    server {
        listen 80;
        server_name _;

        # ========== NGINX HEALTH CHECK (FOR DOCKER ORCHESTRATORS) ==========
        location /nginx-health {
            access_log off;
            return 200 "NGINX healthy\n";
            add_header Content-Type text/plain;
        }

        # ========== ROOT/HOME ENDPOINT ==========
        location = / {
            access_log on;
            proxy_pass http://backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ========== API ENDPOINTS - ROUND ROBIN (Default Load Balancer) ==========
        # This is the primary load balancer for general API requests
        # Distribution: Evenly across all 3 servers in rotation
        location /api/ {
            proxy_pass http://backend;
            access_log /var/log/nginx/api.log upstream_logging;
            
            # Proxy headers to pass client information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Connection optimization
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering for better performance
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # ========== HEALTH CHECK ENDPOINT FROM BACKEND ==========
        location /api/health {
            proxy_pass http://backend;
            access_log off;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }

        # ========== WEBSOCKET SUPPORT - LEAST CONNECTIONS ==========
        # WebSockets need persistent connections, use least_conn for better distribution
        location /ws/ {
            proxy_pass http://backend_least_conn;
            access_log /var/log/nginx/websocket.log upstream_logging;
            
            # WebSocket upgrade headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long-lived connection settings
            proxy_connect_timeout 604800s;  # 7 days
            proxy_send_timeout 604800s;
            proxy_read_timeout 604800s;
            
            # No buffering for WebSocket
            proxy_buffering off;
        }

        # ========== ADMIN ENDPOINTS - STICKY SESSIONS (IP HASH) ==========
        # Admin routes should stick to same server for session consistency
        location /admin/ {
            proxy_pass http://backend_sticky;
            access_log /var/log/nginx/admin.log upstream_logging;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Preserve session cookies
            proxy_cookie_path / /admin/;
            proxy_cookie_flags ~ secure httponly samesite=lax;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ========== HIGH-PRIORITY ENDPOINTS - LEAST CONNECTIONS ==========
        # Critical APIs that need response time optimization
        # Routes to server with fewest active connections
        location /priority/ {
            proxy_pass http://backend_least_conn;
            access_log /var/log/nginx/priority.log upstream_logging;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Aggressive timeouts for quick response
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            # No buffering for minimal latency
            proxy_buffering off;
        }

        # ========== LOAD TESTING ENDPOINTS - WEIGHTED LOAD BALANCER ==========
        # Useful for load testing and demonstrating weighted distribution
        location /weighted/ {
            proxy_pass http://backend_weighted;
            access_log /var/log/nginx/weighted.log upstream_logging;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ========== STATIC FILES ==========
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ========== DEFAULT FALLBACK ==========
        location / {
            proxy_pass http://backend;
            access_log /var/log/nginx/default.log upstream_logging;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ========== ERROR PAGES ==========
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            access_log off;
        }
    }
}
