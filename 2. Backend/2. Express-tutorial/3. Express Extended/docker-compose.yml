version: '3.8'

services:
  # NGINX - Load Balancer / Reverse Proxy
  nginx:
    image: nginx:latest
    container_name: nginx-loadbalancer
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server1
      - server2
      - server3
    networks:
      - express-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Express Server 1 (Port 3000)
  server1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express-server-1
    environment:
      PORT: 3000
      # host.docker.internal resolves to the host machine from inside a
      # container (Docker Desktop) - there's no `mongo` service in this
      # compose file, so this connects to the local MongoDB running
      # directly on the host (visible in MongoDB Compass at localhost:27017).
      MONGODB_URI: mongodb://host.docker.internal:27017/express-adv
      NODE_ENV: development
      SERVER_ID: "Server-1"
    ports:
      - "3000:3000"
    networks:
      - express-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Express Server 2 (Port 3001)
  server2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express-server-2
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://host.docker.internal:27017/express-adv
      NODE_ENV: development
      SERVER_ID: "Server-2"
    ports:
      - "3001:3001"
    networks:
      - express-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Express Server 3 (Port 3002)
  server3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express-server-3
    environment:
      PORT: 3002
      MONGODB_URI: mongodb://host.docker.internal:27017/express-adv
      NODE_ENV: development
      SERVER_ID: "Server-3"
    ports:
      - "3002:3002"
    networks:
      - express-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  express-network:
    driver: bridge

# To run:
# docker-compose up -d
#
# Architecture:
# 
#   Client Requests (http://localhost)
#         ↓
#   ┌─────────────────┐
#   │  NGINX (80)     │
#   │ Load Balancer   │
#   └────┬────┬───┬──┘
#        │    │   │
#        ↓    ↓   ↓
#   ┌────────────────────┐
#   │ Server 1   Server 2   Server 3
#   │ (3000)     (3001)     (3002)
#   │ Express    Express    Express
#   └────────────────────┘
#        │ │ │
#        └─┼─┘
#          ↓
#    Local MongoDB (host.docker.internal:27017)
#
# Features:
# - Round Robin Load Balancing
# - Automatic Health Checks
# - Automatic Failover
# - Session Persistence (via Redis - optional)
