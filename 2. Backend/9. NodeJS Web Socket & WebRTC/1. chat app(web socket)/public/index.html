<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat App - WebSockets + Socket.IO</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      /* JOIN SCREEN */
      .join-card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        padding: 40px;
        width: 100%;
        max-width: 360px;
      }

      .join-card h1 {
        font-size: 20px;
        color: #333;
        margin-bottom: 6px;
      }

      .join-card p {
        font-size: 13px;
        color: #777;
        margin-bottom: 22px;
      }

      .join-card input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
      }

      .join-card button {
        width: 100%;
        margin-top: 14px;
        padding: 12px;
        background: #667eea;
        color: white;
        font-weight: 600;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
      }

      .join-card button:hover {
        background: #5a6fd8;
      }

      /* CHAT SCREEN */
      .chat-container {
        display: none; /* shown via JS once we've joined */
        grid-template-columns: 160px 1fr;
        width: 100%;
        max-width: 800px;
        height: 85vh;
        background: white;
        border-radius: 12px;
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }

      .chat-container.active {
        display: grid;
      }

      .sidebar {
        background: #f8f9fa;
        padding: 15px;
        border-right: 1px solid #ddd;
        overflow-y: auto;
      }

      .sidebar h3 {
        color: #333;
        margin-bottom: 12px;
        font-size: 13px;
        text-transform: uppercase;
        border-bottom: 2px solid #667eea;
        padding-bottom: 8px;
      }

      .sidebar ul {
        list-style: none;
      }

      .sidebar li {
        padding: 6px 8px;
        margin-bottom: 4px;
        background: white;
        border-radius: 4px;
        font-size: 13px;
      }

      .chat-area {
        display: flex;
        flex-direction: column;
      }

      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
      }

      .message {
        margin-bottom: 10px;
        font-size: 14px;
      }

      .message .who {
        font-weight: 600;
        color: #667eea;
        margin-right: 6px;
      }

      .message .time {
        color: #aaa;
        font-size: 11px;
        margin-left: 6px;
      }

      .system-message {
        text-align: center;
        color: #999;
        font-size: 12px;
        margin-bottom: 10px;
        font-style: italic;
      }

      .typing-indicator {
        min-height: 18px;
        padding: 0 15px;
        font-size: 12px;
        color: #999;
        font-style: italic;
      }

      .input-row {
        display: flex;
        padding: 12px;
        border-top: 1px solid #ddd;
        gap: 8px;
      }

      .input-row input {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
      }

      .input-row button {
        padding: 10px 18px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
      }

      .input-row button:hover {
        background: #5a6fd8;
      }
    </style>
  </head>
  <body>
    <!-- JOIN SCREEN -->
    <div class="join-card" id="joinScreen">
      <h1>Chat App</h1>
      <p>One shared room - everyone who joins can see and talk to everyone else.</p>
      <input id="userNameInput" type="text" placeholder="Enter your name" />
      <button id="joinBtn">Join Chat</button>
    </div>

    <!-- CHAT SCREEN -->
    <div class="chat-container" id="chatScreen">
      <div class="sidebar">
        <h3>Online</h3>
        <ul id="userList"></ul>
      </div>

      <div class="chat-area">
        <div class="messages" id="messages"></div>
        <div class="typing-indicator" id="typingIndicator"></div>
        <div class="input-row">
          <input id="messageInput" type="text" placeholder="Type a message..." autocomplete="off" />
          <button id="sendBtn">Send</button>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      // This is the "browser half" - it talks to server.js purely through
      // named events (join, chatMessage, typing, ...). Read server.js first
      // if you haven't - the comments there explain WHY each event exists.

      const socket = io();

      // DOM references
      const joinScreen = document.getElementById("joinScreen");
      const chatScreen = document.getElementById("chatScreen");
      const userNameInput = document.getElementById("userNameInput");
      const joinBtn = document.getElementById("joinBtn");
      const userList = document.getElementById("userList");
      const messagesEl = document.getElementById("messages");
      const typingIndicator = document.getElementById("typingIndicator");
      const messageInput = document.getElementById("messageInput");
      const sendBtn = document.getElementById("sendBtn");

      let myUserName = "";

      // JOIN

      function join() {
        const name = userNameInput.value.trim();
        if (!name) return;

        myUserName = name;
        socket.emit("join", name);

        joinScreen.style.display = "none";
        chatScreen.classList.add("active");
        messageInput.focus();
      }

      joinBtn.addEventListener("click", join);
      userNameInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") join();
      });

      // ONLINE USER LIST

      socket.on("userList", (users) => {
        userList.innerHTML = "";
        users.forEach((name) => {
          const li = document.createElement("li");
          li.textContent = name === myUserName ? `${name} (you)` : name;
          userList.appendChild(li);
        });
      });

      socket.on("userJoined", (name) => {
        if (name !== myUserName) addSystemMessage(`${name} joined the chat`);
      });

      socket.on("userLeft", (name) => {
        addSystemMessage(`${name} left the chat`);
      });

      // MESSAGES

      socket.on("messageHistory", (messages) => {
        messages.forEach(renderMessage);
      });

      socket.on("chatMessage", (message) => {
        renderMessage(message);
      });

      function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;

        socket.emit("chatMessage", text);
        messageInput.value = "";
        socket.emit("stopTyping");
      }

      sendBtn.addEventListener("click", sendMessage);
      messageInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendMessage();
      });

      // TYPING INDICATOR - tell the server as soon as we start typing, and
      // again once we've stopped for a bit (a short timer resets every
      // keystroke, so "stopTyping" only fires once typing actually pauses).
      let typingTimeout;
      messageInput.addEventListener("input", () => {
        socket.emit("typing");
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => socket.emit("stopTyping"), 1000);
      });

      socket.on("userTyping", (name) => {
        typingIndicator.textContent = `${name} is typing...`;
      });

      socket.on("userStoppedTyping", () => {
        typingIndicator.textContent = "";
      });

      // RENDER HELPERS

      function renderMessage(message) {
        const el = document.createElement("div");
        el.className = "message";

        const time = new Date(message.timestamp).toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });

        el.innerHTML =
          `<span class="who">${escapeHtml(message.userName)}:</span>` +
          `${escapeHtml(message.text)}` +
          `<span class="time">${time}</span>`;

        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function addSystemMessage(text) {
        const el = document.createElement("div");
        el.className = "system-message";
        el.textContent = text;
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      // Basic escaping so a message can't inject HTML into the page.
      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }
    </script>
  </body>
</html>
