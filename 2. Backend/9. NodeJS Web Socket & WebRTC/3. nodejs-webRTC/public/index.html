<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebRTC Video Call + Chat</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      /* JOIN SCREEN */
      .join-card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        padding: 40px;
        width: 100%;
        max-width: 380px;
      }

      .join-card h1 {
        font-size: 20px;
        color: #333;
        margin-bottom: 6px;
      }

      .join-card p {
        font-size: 13px;
        color: #777;
        margin-bottom: 22px;
      }

      .join-card label {
        display: block;
        font-size: 12px;
        color: #555;
        margin-bottom: 6px;
        margin-top: 14px;
        text-transform: uppercase;
      }

      .join-card input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
      }

      .join-card button,
      .controls button {
        cursor: pointer;
        border: none;
        border-radius: 6px;
        font-size: 14px;
      }

      .join-card button {
        width: 100%;
        margin-top: 22px;
        padding: 12px;
        background: #667eea;
        color: white;
        font-weight: 600;
      }

      .join-card button:hover {
        background: #5a6fd8;
      }

      .hint {
        font-size: 11px;
        color: #999;
        margin-top: 10px;
      }

      /* CALL SCREEN */
      .call-container {
        display: none; /* shown via JS once we've joined */
        width: 100%;
        max-width: 1200px;
        height: 90vh;
        background: white;
        border-radius: 12px;
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        grid-template-columns: 1fr 280px;
      }

      .call-container.active {
        display: grid;
      }

      .video-area {
        display: flex;
        flex-direction: column;
        background: #1a1a2e;
      }

      .video-grid {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        grid-auto-rows: 1fr;
        gap: 10px;
        padding: 15px;
        overflow-y: auto;
      }

      .video-tile {
        position: relative;
        background: #000;
        border-radius: 8px;
        overflow: hidden;
        min-height: 160px;
      }

      .video-tile video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .video-tile .name-tag {
        position: absolute;
        bottom: 8px;
        left: 8px;
        background: rgba(0, 0, 0, 0.55);
        color: white;
        font-size: 12px;
        padding: 3px 8px;
        border-radius: 4px;
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 12px;
        padding: 14px;
        background: #16213e;
      }

      .controls button {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: #333a56;
        color: white;
        font-size: 18px;
      }

      .controls button.off {
        background: #e04b4b;
      }

      .controls button.leave {
        background: #e04b4b;
        width: auto;
        border-radius: 23px;
        padding: 0 22px;
      }

      /* CHAT SIDEBAR */
      .chat-panel {
        display: flex;
        flex-direction: column;
        border-left: 1px solid #ddd;
      }

      .chat-panel h3 {
        padding: 14px 15px;
        font-size: 14px;
        color: #333;
        border-bottom: 1px solid #ddd;
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 12px 15px;
      }

      .chat-message {
        margin-bottom: 10px;
        font-size: 13px;
      }

      .chat-message .who {
        font-weight: 600;
        color: #667eea;
        margin-right: 6px;
      }

      .chat-input-row {
        display: flex;
        padding: 12px;
        border-top: 1px solid #ddd;
        gap: 8px;
      }

      .chat-input-row input {
        flex: 1;
        padding: 8px 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 13px;
      }

      .chat-input-row button {
        padding: 8px 14px;
        background: #667eea;
        color: white;
      }
    </style>
  </head>
  <body>
    <!-- JOIN SCREEN: enter a name + a room name. Share the same room name with -->
    <!-- someone else and you're in a call together - two people = 1:1 call, -->
    <!-- more people joining the same room = group call. -->
    <div class="join-card" id="joinScreen">
      <h1>Video Call + Chat</h1>
      <p>Powered by WebRTC (peer-to-peer video) + Socket.IO (signaling &amp; chat)</p>

      <label for="userNameInput">Your name</label>
      <input id="userNameInput" type="text" placeholder="e.g. Ayush" />

      <label for="roomNameInput">Room name</label>
      <input id="roomNameInput" type="text" placeholder="e.g. team-standup" />

      <button id="joinBtn">Join Call</button>
      <p class="hint">Tip: open this page in another tab with the same room name to test a call with yourself.</p>
    </div>

    <!-- CALL SCREEN -->
    <div class="call-container" id="callScreen">
      <div class="video-area">
        <div class="video-grid" id="videoGrid">
          <!-- local + remote <video> tiles get inserted here by client.js -->
        </div>
        <div class="controls">
          <button id="micBtn" title="Mute/unmute mic">🎤</button>
          <button id="camBtn" title="Camera on/off">📷</button>
          <button id="leaveBtn" class="leave" title="Leave call">Leave</button>
        </div>
      </div>

      <div class="chat-panel">
        <h3>Chat</h3>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-row">
          <input id="chatInput" type="text" placeholder="Type a message..." />
          <button id="chatSendBtn">Send</button>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
  </body>
</html>
